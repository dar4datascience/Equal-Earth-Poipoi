name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for sf (GDAL / GEOS / PROJ / udunits)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2

      - name: Rebuild data asset with DuckDB spatial
        run: Rscript data-raw/prep_data.R

      - name: Run tests (testServer + data + shinytest2)
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = c("summary", "fail"))'

      - name: Upload shinytest2 artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shinytest2-snapshots
          path: tests/testthat/_snaps

      - name: renv lockfile is in sync
        run: |
          Rscript -e 'if (!renv::status()$synchronized) stop("renv.lock out of sync — run renv::snapshot()")'

      - name: manifest.json is up to date
        run: |
          Rscript -e 'rsconnect::writeManifest(appPrimaryDoc = "app.R")'
          git diff --exit-code manifest.json || {
            echo "::error::manifest.json is stale — run rsconnect::writeManifest() and commit it";
            exit 1;
          }

  # Optional: push-based deploy. The recommended path is Connect Cloud's
  # "Publish from GitHub" with auto-republish (no secrets needed). This job
  # only runs when the secrets below are configured in the repo.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      CONNECT_CLOUD_CLIENT_ID: ${{ secrets.CONNECT_CLOUD_CLIENT_ID }}
      CONNECT_CLOUD_CLIENT_SECRET: ${{ secrets.CONNECT_CLOUD_CLIENT_SECRET }}
      CONNECT_CLOUD_ACCOUNT: ${{ secrets.CONNECT_CLOUD_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        if: env.CONNECT_CLOUD_CLIENT_ID != ''

      - name: System libraries for sf
        if: env.CONNECT_CLOUD_CLIENT_ID != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - uses: r-lib/actions/setup-r@v2
        if: env.CONNECT_CLOUD_CLIENT_ID != ''
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2
        if: env.CONNECT_CLOUD_CLIENT_ID != ''

      # rsconnect-python only deploys Python content; R apps use the R package
      - name: Deploy to Posit Connect Cloud
        if: env.CONNECT_CLOUD_CLIENT_ID != ''
        run: |
          Rscript -e '
            rsconnect::connectCloudClientCredentials(
              clientId = Sys.getenv("CONNECT_CLOUD_CLIENT_ID"),
              clientSecret = Sys.getenv("CONNECT_CLOUD_CLIENT_SECRET"),
              accountName = Sys.getenv("CONNECT_CLOUD_ACCOUNT")
            )
            rsconnect::deployApp(
              appDir = ".",
              appPrimaryDoc = "app.R",
              appTitle = "Equal-Earth-Poipoi",
              launch.browser = FALSE,
              forceUpdate = TRUE
            )'
